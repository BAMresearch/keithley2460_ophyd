name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --extra visa
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src

  test:
    # No test touches an instrument: the backend runs the packaged TSP in a Lua mock.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group test --extra visa
      - run: uv run --locked --no-sync pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Distributions hold the runtime and nothing unexpected
        run: |
          unzip -Z1 dist/*.whl > wheel.txt
          tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' > sdist.txt
          for f in keithley2460_ophyd/tsp/sequencer.tsp keithley2460_ophyd/py.typed; do
            grep -qx "$f" wheel.txt || { echo "wheel lacks $f"; exit 1; }
          done
          grep -qx src/keithley2460_ophyd/tsp/sequencer.tsp sdist.txt
          if grep -E '^(tests|docs)/' wheel.txt; then echo "wheel holds tests or docs"; exit 1; fi
          if grep -E '(^|/)\.(venv|git)/|\.(h5|npz|xlsx)$' sdist.txt; then echo "unexpected sdist files"; exit 1; fi
      - name: The wheel installs and imports on its own
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/python -I - <<'EOF'
          import sys
          import keithley2460_ophyd as k
          from keithley2460_ophyd import sequencer_packaged_runtime

          artifact = sequencer_packaged_runtime()
          print("keithley2460-ophyd", k.__version__, artifact.build, artifact.sha256[:12])
          forbidden = ("electrochemistry_bluesky", "h5py", "pandas", "openpyxl", "plotly",
                       "bluesky_queueserver", "nbformat", "pyvisa")
          loaded = sorted(m for m in sys.modules if m.split(".")[0] in forbidden)
          assert not loaded, loaded
          EOF
          wheel/bin/k2460-diagnose --help > /dev/null
          wheel/bin/oe-diagnose --help > /dev/null

  # Releases (CONTRIBUTING.md), on main once the checks pass. A push that sets
  # a new __version__ (a merged release PR) is tagged, gets a GitHub release
  # and, with the repository variable PYPI_PUBLISH = true, goes to PyPI. Any
  # other push opens or updates the release PR if there is anything to release.
  tag:
    needs: [lint, test, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}  # a re-run tags the commit that set the version
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version() { python3 -c 'import re, sys; print(re.search(r"__version__ = \"([^\"]+)\"", sys.stdin.read()).group(1))'; }
          VERSION=$(version < src/keithley2460_ophyd/__init__.py)
          PREVIOUS=$(git show HEAD^1:src/keithley2460_ophyd/__init__.py | version)
          TAG="v$VERSION"
          if [ "$VERSION" = "0.0.0" ] || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Nothing to tag ($TAG)."
            exit 0
          fi
          if [ "$PREVIOUS" = "$VERSION" ]; then
            echo "::error::$TAG is not tagged, but this commit did not set it: re-run the release of the commit that did."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          python3 - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          text = open("CHANGELOG.md").read()
          section = re.search(rf"^## v{re.escape(sys.argv[1])}\b.*?$(.*?)(?=^## v|\Z)", text, re.M | re.S)
          print(section.group(1).strip() if section else "See CHANGELOG.md.")
          PY
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tag]
    if: needs.tag.outputs.tag != '' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/keithley2460-ophyd/
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-pr:
    needs: [tag]
    if: needs.tag.outputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # to start CI on the release branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@v6
      - id: next
        run: |
          set -eu
          psr() { uvx --from python-semantic-release==10.7.0 semantic-release "$@"; }
          NEXT=$(psr --noop version --print)
          LAST=$(psr version --print-last-released 2>/dev/null || true)
          echo "next=$NEXT, last released=${LAST:-none}"
          if [ -z "$NEXT" ] || [ "$NEXT" = "$LAST" ]; then
            echo "Nothing to release."
            exit 0
          fi
          psr version --no-commit --no-tag --no-push --no-vcs-release --skip-build
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.version != ''
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/next
          delete-branch: true
          commit-message: "chore(release): v${{ steps.next.outputs.version }}"
          title: "chore(release): v${{ steps.next.outputs.version }}"
          body: |
            Prepared by python-semantic-release: `__version__` and CHANGELOG.md.
            Edit the changelog on this branch if needed. Merging tags
            v${{ steps.next.outputs.version }} and creates the GitHub release
            (and publishes to PyPI when PYPI_PUBLISH is true).

            Checks run from a CI run this workflow starts on the release branch
            (checks of a PR opened with the workflow token do not start by themselves). If they
            are missing, run CI on release/next from the Actions tab.
      # GitHub does not start (or holds for approval) the checks of a PR opened with
      # the workflow token, but allows a workflow_dispatch run on its branch, whose
      # checks report on the PR's head commit.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref release/next
